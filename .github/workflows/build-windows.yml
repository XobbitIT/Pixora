name: Build Pixora Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      PIXORA_NATIVE_CLIPBOARD_SMOKE: '1'
      PIXORA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Record clean runner runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path verification -Force | Out-Null
          dotnet --info | Out-File verification/dotnet-info.txt -Encoding utf8

      - name: Restore
        run: dotnet restore src/CanvasForge.App/CanvasForge.App.csproj

      - name: Core regression tests
        run: dotnet run --project tests/CanvasForge.Core.Tests/CanvasForge.Core.Tests.csproj -c Release

      - name: WPF adaptive UI checks
        run: dotnet run --project tests/CanvasForge.App.Tests/CanvasForge.App.Tests.csproj -c Release -p:BuildInParallel=false -- ui-verification

      - name: Read build version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          "PIXORA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish win-x64 self-contained
        run: dotnet publish src/CanvasForge.App/CanvasForge.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:SourceRevisionId=${{ env.PIXORA_SOURCE_SHA }} -o publish/windows-x64

      - name: Check published DLLs
        shell: pwsh
        run: |
          $verificationHost = 'verification/published-host'
          New-Item -ItemType Directory -Path $verificationHost -Force | Out-Null
          Copy-Item 'tests/CanvasForge.App.Tests/bin/Release/net8.0-windows/*' $verificationHost -Recurse -Force
          Copy-Item 'tests/CanvasForge.Core.Tests/bin/Release/net8.0/*' $verificationHost -Recurse -Force
          Copy-Item 'publish/windows-x64/*' $verificationHost -Recurse -Force
          foreach ($assembly in @('Pixora.dll', 'CanvasForge.Core.dll')) {
            $publishedHash = (Get-FileHash "publish/windows-x64/$assembly" -Algorithm SHA256).Hash
            $testedHash = (Get-FileHash "$verificationHost/$assembly" -Algorithm SHA256).Hash
            if ($publishedHash -ne $testedHash) { throw "Published DLL mismatch: $assembly" }
          }
          dotnet "$verificationHost/CanvasForge.Core.Tests.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet "$verificationHost/CanvasForge.App.Tests.dll" published-ui-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pixora_Windows_Validation
          path: |
            verification/dotnet-info.txt
            ui-verification/**
            published-ui-verification/**
          if-no-files-found: warn

      - name: Check package documents and version contract
        shell: pwsh
        run: |
          ./tools/Package-Version.ps1 -SelfTest -WriteDocuments -PackageDirectory "$PWD/publish/windows-x64" -SourceDirectory "$PWD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Pixora portable
        uses: actions/upload-artifact@v4
        with:
          name: Pixora_${{ env.PIXORA_VERSION }}_Windows_x64
          path: publish/windows-x64/**
          if-no-files-found: error
