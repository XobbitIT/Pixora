name: Build Pixora Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/CanvasForge.App/CanvasForge.App.csproj

      - name: Core regression tests
        run: dotnet run --project tests/CanvasForge.Core.Tests/CanvasForge.Core.Tests.csproj -c Release

      - name: Read build version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          "PIXORA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish win-x64 self-contained
        run: dotnet publish src/CanvasForge.App/CanvasForge.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish/windows-x64

      - name: Upload Pixora portable
        uses: actions/upload-artifact@v4
        with:
          name: Pixora_${{ env.PIXORA_VERSION }}_Windows_x64
          path: publish/windows-x64/**
          if-no-files-found: error
